name: Daily reel
on:
  schedule:
    - cron: "30 13 * * *"   # 7:00 PM India time, every day
  workflow_dispatch:
    inputs:
      day:
        description: "Day number to post (0-based). Leave empty for today."
        required: false
permissions:
  contents: write
concurrency: daily-reel
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      META_TOKEN: ${{ secrets.META_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - name: Stop early until accounts are connected
        id: ready
        run: |
          if [ -z "$META_TOKEN" ]; then
            echo "::warning::Instagram/Facebook not connected yet. Run scripts/setup_meta.py."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'yes'
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.go == 'yes'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        if: steps.ready.outputs.go == 'yes'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0
          pip install -q -r requirements.txt
      - name: Make the reel
        if: steps.ready.outputs.go == 'yes'
        run: python scripts/make_reel.py ${{ inputs.day && format('--day {0}', inputs.day) || '' }}
      - name: Post to Instagram and Facebook
        if: steps.ready.outputs.go == 'yes'
        run: python scripts/post.py
      - name: Save the posting log
        if: always() && steps.ready.outputs.go == 'yes'
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -q -m "log: posted reel" && git push -q)
      - name: Keep a copy of the reel
        if: always() && steps.ready.outputs.go == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/
          retention-days: 7
